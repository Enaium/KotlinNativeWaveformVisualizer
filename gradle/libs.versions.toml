[versions]
kotlin = "2.4.10"
foojay = "1.0.0"
filekit = "0.15.0"
webview-kmp = "1.0.1"
kembeddable = "1.3.10"
kotlinx-coroutines = "1.11.0"

[libraries]
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
filekit-dialogs = { module = "io.github.vinceglb:filekit-dialogs", version.ref = "filekit" }
webview-kmp = { module = "cn.enaium.webview:webview-kmp", version.ref = "webview-kmp" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay" }
kembeddable = { id = "cn.rtast.kembeddable", version.ref = "kembeddable" }
